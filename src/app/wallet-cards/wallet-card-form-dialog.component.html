<div class="dialog-container">
  <div class="dialog-header">
    <h2 class="dialog-title">{{ isEditMode ? 'Edit Wallet Card' : 'Create Wallet Card' }}</h2>
    <button mat-icon-button class="close-btn" (click)="closeDialog()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-content">
    <form [formGroup]="cardForm" (ngSubmit)="onSubmit()">
      <div class="form-card">
        <div class="form-group">
          <label for="title">Title *</label>
          <input id="title" type="text" formControlName="title" placeholder="e.g. Starter Pack" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="amount">Amount (₹) *</label>
            <input id="amount" type="number" formControlName="amount" min="1" />
          </div>
          <div class="form-group">
            <label for="bonusAmount">Bonus (₹)</label>
            <input id="bonusAmount" type="number" formControlName="bonusAmount" min="0" />
          </div>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="2" formControlName="description"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cardColor">Card color</label>
            <input id="cardColor" type="color" formControlName="cardColor" />
          </div>
          <div class="form-group">
            <label for="sortOrder">Sort order</label>
            <input id="sortOrder" type="number" formControlName="sortOrder" min="0" />
          </div>
        </div>

        <div class="form-group toggle-row">
          <label>Active</label>
          <mat-slide-toggle formControlName="active" color="primary"></mat-slide-toggle>
        </div>
      </div>

      <div class="error-message dialog-error" *ngIf="error">{{ error }}</div>

      <div class="dialog-actions">
        <button type="button" mat-button (click)="closeDialog()">Cancel</button>
        <button type="submit" mat-flat-button color="primary" [disabled]="loading">
          {{ loading ? 'Saving...' : (isEditMode ? 'Update' : 'Create Card') }}
        </button>
      </div>
    </form>
  </div>
</div>
