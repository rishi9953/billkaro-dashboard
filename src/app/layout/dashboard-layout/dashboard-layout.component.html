<section class="pages-content" [class.sidebar-collapsed]="sidebarCollapsed">
  <!-- Mobile Sidebar Overlay -->
  <div class="sidebar-overlay" *ngIf="sidebarOpen" (click)="closeSidebar()"></div>

  <div class="pages-sidebar" [class.open]="sidebarOpen" [class.collapsed]="sidebarCollapsed">
    <div>
      <div class="siderbar-heading">
        <div class="logo logoSidebar" [ngClass]="'default'">
          <img src="assets/images/logo.jpeg" alt="BillKaro" onerror="this.style.display='none'" />
        </div>
        <button class="sidebar-collapse-btn" (click)="toggleSidebarCollapse()" [attr.aria-label]="sidebarCollapsed ? 'Expand sidebar' : 'Minimize sidebar'" [title]="sidebarCollapsed ? 'Expand sidebar' : 'Minimize sidebar'">
          <mat-icon>{{ sidebarCollapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
        </button>
        <button class="close-sidebar-btn" (click)="closeSidebar()" aria-label="Close sidebar">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <div class="pages-sidebar-item-list top">
        <ul class="pages-sidebar-items">
          <ng-container *ngFor="let item of pageDashboardLink">
            <li class="pages-sidebar-item"
                [routerLink]="item.path"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{exact: false}"
                (click)="navigateToRoute(item.path)">
              <mat-icon>{{ item?.icon }}</mat-icon>
              <span class="sidebar-label">{{ item.label }}</span>
            </li>
          </ng-container>
        </ul>
      </div>
    </div>
    <div>
      <div class="pages-sidebar-item-list bottom">
        <ul class="pages-sidebar-items">
          <ng-container *ngFor="let item of pageDashboardLinkBottom">
            <li class="pages-sidebar-item" (click)="item.label === 'Sign Out' ? openSignOutModal() : null"
              [routerLink]="item.label !== 'Sign Out' ? item.path : null" routerLinkActive="active">
              <mat-icon>{{ item?.icon }}</mat-icon>
              <span class="sidebar-label">{{ item.label }}</span>
            </li>
          </ng-container>
        </ul>
      </div>
    </div>
  </div>
  <div class="page-content">
    <div class="nav-bar">
      <button class="mobile-menu-btn" (click)="toggleSidebar()" aria-label="Toggle menu" type="button">
        <mat-icon aria-hidden="true">menu</mat-icon>
      </button>
      <div class="nav-center">
        <h2 class="page-title-nav">{{ currentPageTitle }}</h2>
      </div>
      <div class="nav-left">
        <button type="button" class="theme-toggle-btn" (click)="toggleTheme()" [attr.aria-label]="themeService.isDark ? 'Switch to light mode' : 'Switch to dark mode'" [title]="themeService.isDark ? 'Light mode' : 'Dark mode'">
          <mat-icon>{{ themeService.isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>
        <div class="admin-details">
          <div class="admin-image">
            <span>{{ name.charAt(0).toUpperCase() }}</span>
          </div>
          <div class="admin-name">
            <span>{{ name | titlecase }}</span>
            <span class="sub-detail">{{ email }}</span>
          </div>
        </div>
      </div>
    </div>
    <router-outlet></router-outlet>
  </div>
</section>
