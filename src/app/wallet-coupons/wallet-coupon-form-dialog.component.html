<div class="dialog-container">
  <div class="dialog-header">
    <h2 class="dialog-title">{{ isEditMode ? 'Edit Wallet Coupon' : 'Create Wallet Coupon' }}</h2>
    <button mat-icon-button class="close-btn" (click)="closeDialog()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-content">
    <form [formGroup]="couponForm" (ngSubmit)="onSubmit()">
      <div class="form-card">
        <div class="form-group">
          <label for="code">Coupon code *</label>
          <input
            id="code"
            type="text"
            formControlName="code"
            placeholder="e.g. SAVE1000"
            maxlength="8"
            autocomplete="off"
            style="text-transform: uppercase"
            [class.error]="hasFieldError('code')"
          />
          <div class="field-hint">Exactly 8 letters or numbers</div>
          <div class="error-message" *ngIf="fieldError('code')">{{ fieldError('code') }}</div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="creditAmount">Credit amount (₹) *</label>
            <input
              id="creditAmount"
              type="number"
              formControlName="creditAmount"
              min="1"
              step="0.01"
              [class.error]="hasFieldError('creditAmount')"
            />
            <div class="error-message" *ngIf="fieldError('creditAmount')">{{ fieldError('creditAmount') }}</div>
          </div>
          <div class="form-group">
            <label for="maxRedemptions">Max redemptions</label>
            <input
              id="maxRedemptions"
              type="number"
              formControlName="maxRedemptions"
              min="1"
              placeholder="Unlimited"
              [class.error]="hasFieldError('maxRedemptions')"
            />
            <div class="error-message" *ngIf="fieldError('maxRedemptions')">{{ fieldError('maxRedemptions') }}</div>
          </div>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea
            id="description"
            rows="2"
            formControlName="description"
            maxlength="300"
            [class.error]="hasFieldError('description')"
          ></textarea>
          <div class="error-message" *ngIf="fieldError('description')">{{ fieldError('description') }}</div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="startsAt">Starts on</label>
            <input
              id="startsAt"
              type="date"
              formControlName="startsAt"
              [class.error]="hasFieldError('startsAt')"
            />
            <div class="error-message" *ngIf="fieldError('startsAt')">{{ fieldError('startsAt') }}</div>
          </div>
          <div class="form-group">
            <label for="expiresAt">Expires on</label>
            <input
              id="expiresAt"
              type="date"
              formControlName="expiresAt"
              [class.error]="hasFieldError('expiresAt')"
            />
            <div class="error-message" *ngIf="fieldError('expiresAt')">{{ fieldError('expiresAt') }}</div>
          </div>
        </div>

        <div class="form-group toggle-row">
          <label>Active</label>
          <mat-slide-toggle formControlName="active" color="primary"></mat-slide-toggle>
        </div>
      </div>

      <div class="error-message dialog-error" *ngIf="error">{{ error }}</div>

      <div class="dialog-actions">
        <button type="button" mat-button (click)="closeDialog()">Cancel</button>
        <button type="submit" mat-flat-button color="primary" [disabled]="loading">
          {{ loading ? 'Saving...' : (isEditMode ? 'Update' : 'Create Coupon') }}
        </button>
      </div>
    </form>
  </div>
</div>
