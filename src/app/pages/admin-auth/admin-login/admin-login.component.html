<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="assets/images/logo.jpeg" alt="BillKaro" onerror="this.style.display='none'" />
    </div>
    <div class="auth-header">
      <h1>Admin Login</h1>
      <p>Sign in to manage the dashboard</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="admin@example.com" />
        <div class="hint error" *ngIf="f['email'].touched && f['email'].errors">
          <span *ngIf="f['email'].errors['required']">Email is required</span>
          <span *ngIf="f['email'].errors['email']">Enter a valid email</span>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            id="password"
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="••••••••"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
            tabindex="-1"
          >
            <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
        </div>
        <div class="hint error" *ngIf="f['password'].touched && f['password'].errors">
          <span *ngIf="f['password'].errors['required']">Password is required</span>
          <span *ngIf="f['password'].errors['minlength']">Minimum 6 characters</span>
        </div>
      </div>

      <div class="banner error" *ngIf="error">{{ error }}</div>

      <button class="primary" type="submit" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Login' }}
      </button>

      <div class="footer">
        <span>New admin?</span>
        <a routerLink="/admin/signup">Create account</a>
      </div>
    </form>
  </div>
</div>
