<div class="dialog-container">
  <div class="dialog-header">
    <h2 class="dialog-title">{{ isEditMode ? 'Edit Service' : 'Add New Service' }}</h2>
    <button mat-icon-button class="close-btn" (click)="closeDialog()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-content">
    <form [formGroup]="serviceForm" (ngSubmit)="onSubmit()">
      <div class="form-card">
        <div class="form-group">
          <label for="name">Name *</label>
          <input
            type="text"
            id="name"
            formControlName="name"
            placeholder="e.g. Bill Printing"
            [class.error]="submitted && f['name'].errors"
          />
          <div class="error-message" *ngIf="submitted && f['name'].errors">
            <span *ngIf="f['name'].errors['required']">Name is required</span>
            <span *ngIf="f['name'].errors['maxlength']">Max 200 characters</span>
          </div>
        </div>

        <div class="form-group toggle-row">
          <label>Active</label>
          <mat-slide-toggle formControlName="active" color="primary">
            Active
          </mat-slide-toggle>
        </div>
      </div>

      <div class="error-message dialog-error" *ngIf="error">{{ error }}</div>

      <div class="dialog-actions">
        <button type="button" mat-button (click)="closeDialog()">Cancel</button>
        <button type="submit" mat-flat-button color="primary" [disabled]="loading">
          {{ loading ? 'Saving...' : (isEditMode ? 'Update' : 'Add Service') }}
        </button>
      </div>
    </form>
  </div>
</div>
